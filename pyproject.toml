[project]
name = "mlnotebook"
version = "0.1.0"
description = "Theory and applied code for The Applied AI Engineer's Compendium."
readme = "README.md"
authors = [
    { name = "CypherEuan", email = "euan.cortes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[project.urls]
Repository = "https://github.com/EuanCortes/Euan_AI_ML_Master_Notebook"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
