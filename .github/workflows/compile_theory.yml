name: Compile LaTeX Theory Book

on:
  push:
    branches: [ "main" ]
    paths:
      - 'theory/**'  
  pull_request:
    branches: [ "main" ]
    paths:
      - 'theory/**'   

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: theory 
          compiler: latexmk
          args: -pdf -interaction=nonstopmode -synctex=1 -file-line-error

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: applied-ai-compendium
          path: theory/main.pdf      # <-- UPDATE HERE
